<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Una cartita para ti</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Outfit:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;1,400&family=Special+Elite&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['"Playfair Display"', 'serif'],
            sans: ['"Outfit"', 'sans-serif'],
            typewriter: ['"Special Elite"', 'monospace'],
            handwriting: ['"Caveat"', 'cursive'],
          },
          colors: {
            parchment: '#fbf7ee',
            ink: '#27201c',
            warmRose: '#e88298',
            ambientAmber: '#fdf2e9',
          }
        }
      }
    }
  </script>

  <style>
    /* Blinking typing cursor */
    .typing-cursor {
      display: inline-block;
      width: 2px;
      height: 1.25em;
      background-color: #8b3a4a;
      vertical-align: -0.18em;
      margin-left: 2px;
      animation: blink 0.75s infinite cubic-bezier(1, 0, 0, 1);
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    /* Ambient floating glowing dust particles */
    .ambient-particle {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      animation: floatUp linear infinite;
    }
    @keyframes floatUp {
      0% {
        transform: translateY(100vh) scale(0.6);
        opacity: 0;
      }
      20% {
        opacity: 0.6;
      }
      80% {
        opacity: 0.6;
      }
      100% {
        transform: translateY(-10vh) scale(1.1);
        opacity: 0;
      }
    }

    /* Subtle paper texture overlay */
    .paper-texture {
      background-color: #faf5ed;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(240, 206, 178, 0.25) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(230, 177, 185, 0.2) 0%, transparent 45%);
    }

    /* Custom smooth scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0,0,0,0.02);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(180, 140, 130, 0.4);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(180, 140, 130, 0.7);
    }
  </style>
</head>
<body class="min-h-screen bg-[#1c1819] text-[#2c2420] font-sans antialiased flex flex-col items-center justify-center p-3 sm:p-6 relative overflow-x-hidden select-none">

  <!-- Background Animated Canvas/Glow -->
  <div id="ambient-container" class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
    <div class="absolute -top-32 -left-32 w-96 h-96 bg-rose-900/20 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-amber-700/20 rounded-full blur-3xl"></div>
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-rose-500/10 rounded-full blur-3xl"></div>
  </div>

  <main class="w-full max-w-2xl relative z-10 flex flex-col items-center my-6">

    <!-- Top Floating Toolbar -->
    <header class="w-full flex items-center justify-between px-4 py-2.5 mb-4 bg-white/10 backdrop-blur-md border border-white/15 rounded-2xl shadow-lg text-rose-100 text-xs sm:text-sm">
      <div class="flex items-center gap-2">
        <span class="inline-flex h-2 w-2 rounded-full bg-rose-400 animate-ping"></span>
        <span class="font-medium tracking-wide">Para alguien especial</span>
      </div>

      <!-- Action Buttons -->
      <div class="flex items-center gap-1.5 sm:gap-2">
        <!-- Sound Toggle -->
        <button id="toggle-sound-btn" class="px-2.5 py-1.5 rounded-xl bg-white/10 hover:bg-white/20 active:scale-95 transition flex items-center gap-1.5" title="Sonido de máquina de escribir">
          <svg id="sound-icon-on" class="w-4 h-4 text-rose-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/>
          </svg>
          <span id="sound-text" class="hidden sm:inline">Sonido: On</span>
        </button>

        <!-- Speed Selector -->
        <button id="speed-btn" class="px-2.5 py-1.5 rounded-xl bg-white/10 hover:bg-white/20 active:scale-95 transition font-mono" title="Velocidad">
          1x
        </button>

        <!-- Skip Button -->
        <button id="skip-btn" class="px-3 py-1.5 rounded-xl bg-rose-600/80 hover:bg-rose-500 text-white font-medium shadow-sm transition active:scale-95 flex items-center gap-1">
          <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20">
            <path d="M4.555 5.168A1 1 0 003 6v8a1 1 0 001.555.832L10 11.202V14a1 1 0 001.555.832l7-5a1 1 0 000-1.664l-7-5A1 1 0 0010 4v2.798L4.555 5.168z"/>
          </svg>
          <span>Mostrar todo</span>
        </button>
      </div>
    </header>

    <article class="w-full paper-texture rounded-2xl sm:rounded-3xl shadow-2xl border border-[#ede3d1] p-6 sm:p-10 md:p-12 relative overflow-hidden transition-all duration-300">
      
      <!-- Vintage Postage & Decorative Badges -->
      <div class="flex justify-between items-start border-b border-[#e2d6c3] pb-5 mb-7">
        <div>
          <span class="text-[10px] tracking-widest uppercase font-semibold text-rose-800/60 font-sans block">Mensaje cifrado & galletil</span>
          <h1 class="text-xl sm:text-2xl font-serif font-bold text-[#352520] tracking-tight">Nota para una persona linda</h1>
        </div>
        <div class="flex items-center gap-1.5 text-xs text-amber-900/60 font-mono border border-amber-900/20 px-2.5 py-1 rounded-lg bg-amber-50/50">
          <span>☕🍪</span>
          <span class="text-[11px]">10:00–11:00 PM</span>
        </div>
      </div>

      <!-- Letter Body with Typewriter Effect Container -->
      <div id="typewriter-content" class="font-sans leading-relaxed text-[#2c221e] text-[15px] sm:text-[16.5px] space-y-5 tracking-[0.01em]">
        <!-- Paragraph elements will be appended and typed character-by-character here -->
      </div>

      <!-- Interactive Signature / Stamp Section (Appears after completion) -->
      <div id="letter-stamp" class="opacity-0 transition-opacity duration-1000 mt-10 pt-6 border-t border-[#e8dccb] flex flex-col sm:flex-row items-center justify-between gap-4">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-full bg-rose-100 border border-rose-200 flex items-center justify-center text-lg shadow-inner">
            🦛
          </div>
          <div class="text-xs text-[#5a4842]">
            <p class="font-semibold text-rose-950">Acreditado por el Capibara Rosa</p>
            <p class="text-[11px] text-amber-900/70">Aduana de la Rep. Independiente de Arequipa ✓</p>
          </div>
        </div>

        <button id="restart-btn" class="text-xs text-rose-700 hover:text-rose-900 flex items-center gap-1.5 font-medium px-3 py-1.5 rounded-lg hover:bg-rose-50 transition">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
          </svg>
          <span>Volver a escribir</span>
        </button>
      </div>

    </article>

    <!-- Footer Note -->
    <footer class="mt-4 text-rose-200/50 text-[11px] tracking-wider text-center">
      Hecho con cariño & paciencia • Presiona cualquier parte para enfocar
    </footer>

  </main>

  <script>
    // Exact Letter Paragraphs provided by the user
    const paragraphsData = [
      {
        text: "Oña belleza, ¿qué tal estás? Siento que deben ser como las 10 u 11 en la hora que estés viendo este mensaje. Es una combinación de lo que tenía que decirte ayer pero no pude, ya que te sentías cansada por el día que tuviste y quería que descansaras lo antes posible.",
        className: "text-[#2c221e]"
      },
      {
        text: "Ahora que ya tienes la galleta de café en tus manos (que como dices parece un botón, o no sé jsjs), espero que te sirva para descansar y le haga compañía a tu alicornio, que sí se ve que puede volar con semejantes alas. La verdad me agradó bastante cuando lo vi, porque se nota que lo quieres mucho. Y así también espero que cuides al capibara rosa, que obviamente está correctamente documentado y no entró de ilegal a la República Independiente de Arequipa.",
        className: "text-[#2c221e]"
      },
      {
        text: "Sobre el código: al comienzo pensé en poner canciones que quería escuchar contigo y otras simplemente para cantártelas en vivo solo a ti, aunque mi voz no sea tan afinada. Pero después de poner algunas, vi que podía armar un mensaje secreto, así que mejor pasé a ese plan. Aunque se nota que eres Light Yagami, porque lo dedujiste demasiado rápido. Ahora espero ver el mensaje que prometiste poner en el álbum o no sé dónde, pero ya quiero descubrirlo.",
        className: "text-[#2c221e]"
      },
      {
        text: "Continuando con la playlist, puse la mayoría porque me hacen sentir algo a mí y otras porque pensé que te gustaría que estuvieran ahí. Algunas de esas hasta me sacan lágrimas, me ponen feliz o simplemente me encantan, y quiero ver si adivinas exactamente qué canciones me causan esas sensaciones (aunque tengo pensado explicártelo otro día). Ahora yo espero tu mensaje y también que agregues las canciones que quieras para escucharlas algún día juntos, ya sea por llamada o en persona.",
        className: "text-[#2c221e]"
      },
      {
        text: "La verdad quise enviarte flores de verdad, pero prefiero comprarlas y elegirlas yo mismo; en este caso, por ser envío, tuve que recurrir a unas artificiales. También puse algo para que comieras y ando feliz de haber acertado con lo que te gustaba. Cada detalle que puse en la caja, desde el capibara rosa hasta el frasco, fue con la intención de alegrarte el día.",
        className: "text-[#2c221e]"
      },
      {
        text: "Y bueno... también quería decirte lo que puse oculto en la playlist: que te amo y nunca lo olvides. Pero no sé, me hago bolita, porque me entra la duda de si sientes lo mismo o qué tanto, ya que no me has dicho cómo vamos por ahora. O tal vez solo soy yo, un joven un poco confundido tratando de saber si estamos yendo bien en esta... si se puede decir, nueva oportunidad.",
        className: "text-[#2c221e] bg-rose-50/70 p-3.5 rounded-xl border-l-2 border-rose-400"
      },
      {
        text: "Quería agregar algo más, pero ya se hizo largo y soy medio malo escribiendo para esto. Hasta aquí la nota.",
        className: "text-[#2c221e]"
      },
      {
        text: "Se despide el Dr. House... digo, Romancito.",
        className: "text-right font-handwriting text-2xl sm:text-3xl text-rose-900 pt-4 font-bold block"
      }
    ];

    // State Variables
    let soundEnabled = true;
    let speedMultiplier = 1; // 1x, 1.75x, 2.5x
    let isTyping = false;
    let skipRequested = false;
    let currentPIndex = 0;
    let currentCharIndex = 0;
    let typingTimer = null;

    // Elements
    const container = document.getElementById("typewriter-content");
    const stampEl = document.getElementById("letter-stamp");
    const toggleSoundBtn = document.getElementById("toggle-sound-btn");
    const soundText = document.getElementById("sound-text");
    const soundIconOn = document.getElementById("sound-icon-on");
    const speedBtn = document.getElementById("speed-btn");
    const skipBtn = document.getElementById("skip-btn");
    const restartBtn = document.getElementById("restart-btn");

    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playTypewriterKeyClick() {
      if (!soundEnabled) return;
      try {
        initAudio();
        const now = audioCtx.currentTime;

        // White noise burst for mechanical click
        const bufferSize = audioCtx.sampleRate * 0.018; // ~18ms
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.3));
        }

        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;

        // Bandpass filter for tactile key tap
        const filter = audioCtx.createBiquadFilter();
        filter.type = "bandpass";
        filter.frequency.setValueAtTime(1400 + Math.random() * 600, now);
        filter.Q.setValueAtTime(3.0, now);

        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.045, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.02);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);

        noise.start(now);
      } catch (e) {
        // Fallback silently if audio policy prevents autoplay
      }
    }

    let cursorEl = document.createElement("span");
    cursorEl.className = "typing-cursor";

    function startTyping() {
      clearTimeout(typingTimer);
      container.innerHTML = "";
      stampEl.classList.remove("opacity-100");
      stampEl.classList.add("opacity-0");
      currentPIndex = 0;
      currentCharIndex = 0;
      skipRequested = false;
      isTyping = true;
      typeNextCharacter();
    }

    function createParagraphElement(index) {
      const p = document.createElement("p");
      p.className = paragraphsData[index].className;
      p.id = `para-${index}`;
      container.appendChild(p);
      return p;
    }

    function typeNextCharacter() {
      if (!isTyping) return;

      if (skipRequested) {
        renderAllImmediately();
        return;
      }

      if (currentPIndex >= paragraphsData.length) {
        finishTyping();
        return;
      }

      const pData = paragraphsData[currentPIndex];
      let pElem = document.getElementById(`para-${currentPIndex}`);
      if (!pElem) {
        pElem = createParagraphElement(currentPIndex);
      }

      // Append next char
      const char = pData.text.charAt(currentCharIndex);
      pElem.textContent = pData.text.slice(0, currentCharIndex + 1);
      pElem.appendChild(cursorEl);

      // Play soft typing click on non-spaces
      if (char !== " " && char !== "") {
        playTypewriterKeyClick();
      }

      currentCharIndex++;

      if (currentCharIndex >= pData.text.length) {
        // Finished current paragraph
        currentPIndex++;
        currentCharIndex = 0;
        
        // Slightly longer pause between paragraphs
        const delay = (Math.floor(Math.random() * 200) + 400) / speedMultiplier;
        typingTimer = setTimeout(typeNextCharacter, delay);
      } else {
        // Realistic human typing cadence with punctuation pauses
        let delay = (Math.floor(Math.random() * 25) + 20) / speedMultiplier;
        if ([",", ";", ":"].includes(char)) {
          delay += 120 / speedMultiplier;
        } else if ([".", "!", "?"].includes(char)) {
          delay += 250 / speedMultiplier;
        }
        typingTimer = setTimeout(typeNextCharacter, delay);
      }
    }

    function renderAllImmediately() {
      clearTimeout(typingTimer);
      container.innerHTML = "";
      paragraphsData.forEach((item, index) => {
        const p = document.createElement("p");
        p.className = item.className;
        p.textContent = item.text;
        container.appendChild(p);
      });
      finishTyping();
    }

    function finishTyping() {
      isTyping = false;
      if (cursorEl.parentNode) {
        cursorEl.parentNode.removeChild(cursorEl);
      }
      stampEl.classList.remove("opacity-0");
      stampEl.classList.add("opacity-100");
    }

    function createAmbientGlow() {
      const ambient = document.getElementById("ambient-container");
      const colors = ['#f472b6', '#fb7185', '#fbbf24', '#fbcfe8'];

      for (let i = 0; i < 22; i++) {
        const particle = document.createElement("div");
        particle.className = "ambient-particle";
        const size = Math.random() * 4 + 2;
        particle.style.width = `${size}px`;
        particle.style.height = `${size}px`;
        particle.style.left = `${Math.random() * 100}vw`;
        particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        particle.style.boxShadow = `0 0 ${size * 2}px ${particle.style.backgroundColor}`;
        particle.style.animationDuration = `${Math.random() * 10 + 10}s`;
        particle.style.animationDelay = `${Math.random() * 8}s`;
        ambient.appendChild(particle);
      }
    }

    toggleSoundBtn.addEventListener("click", () => {
      initAudio();
      soundEnabled = !soundEnabled;
      if (soundEnabled) {
        soundText.textContent = "Sonido: On";
        soundIconOn.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/>`;
        soundIconOn.classList.remove("text-stone-400");
        soundIconOn.classList.add("text-rose-300");
      } else {
        soundText.textContent = "Sonido: Off";
        soundIconOn.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z m12 0l-6-6m0 6l6-6"/>`;
        soundIconOn.classList.remove("text-rose-300");
        soundIconOn.classList.add("text-stone-400");
      }
    });

    speedBtn.addEventListener("click", () => {
      if (speedMultiplier === 1) {
        speedMultiplier = 1.75;
        speedBtn.textContent = "1.75x";
      } else if (speedMultiplier === 1.75) {
        speedMultiplier = 2.5;
        speedBtn.textContent = "2.5x";
      } else {
        speedMultiplier = 1;
        speedBtn.textContent = "1x";
      }
    });

    skipBtn.addEventListener("click", () => {
      skipRequested = true;
      renderAllImmediately();
    });

    restartBtn.addEventListener("click", () => {
      startTyping();
    });

    // Start everything on window load
    window.addEventListener("DOMContentLoaded", () => {
      createAmbientGlow();
      // Brief aesthetic pause before typing begins
      setTimeout(() => {
        startTyping();
      }, 700);
    });
  </script>
</body>
</html>
